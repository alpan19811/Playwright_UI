name: Run Autotests

# Когда запускать
on:
  push:                      # при каждом пуше
    branches: [ main ]
  pull_request:              # при каждом PR в main
    branches: [ main ]
  workflow_dispatch:         # кнопка ручного запуска в GitHub

jobs:
  # ---------- JOB 1: API-тесты ----------
  api-tests:
    runs-on: ubuntu-latest   # виртуалка с Ubuntu
    steps:
      - name: Checkout code              # скачать код репозитория
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run API tests
        run: pytest tests/API -v         # путь поправь под свою папку

  # ---------- JOB 2: UI-тесты ----------
  ui-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run UI tests
        run: pytest tests/UI -v          # путь поправь под свою папку

      - name: Upload traces and screenshots
        if: failure()                    # только если тесты упали
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: test-results/            # трейсы, скриншоты, видео